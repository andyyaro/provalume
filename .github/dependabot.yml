version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # Provalume has three mandatory runtime dependencies by design. A new one
    # needs a human decision, not an automated bump.
    open-pull-requests-limit: 5
