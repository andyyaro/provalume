[project]
name = "provalume"
version = "0.1.1"
description = "Verified, git-aware memory for autonomous software agents—tracking what worked, what failed, what is currently true, and the evidence that proved it."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andy Yaro" }]
keywords = [
    "agent-memory",
    "provenance",
    "verification",
    "developer-tools",
    "mcp",
    "sqlite",
    "local-first",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "typer>=0.15,<1",
    "rich>=13.9",
]

[project.optional-dependencies]
# Cryptographic provenance signatures (Ed25519). Without this extra,
# HMAC-SHA256 keyed integrity still works via the standard library, and
# Ed25519-signed imports are quarantined rather than silently trusted.
signatures = ["cryptography>=42"]
# Experimental vector retrieval. Never required: retrieval degrades to
# lexical-only, which is the tested default path.
vectors = ["numpy>=1.26"]
model2vec = ["provalume[vectors]", "model2vec>=0.8"]
fastembed = ["provalume[vectors]", "fastembed>=0.5"]

[project.urls]
Homepage = "https://github.com/andyyaro/provalume"
Repository = "https://github.com/andyyaro/provalume"
Issues = "https://github.com/andyyaro/provalume/issues"
Changelog = "https://github.com/andyyaro/provalume/blob/main/CHANGELOG.md"
Documentation = "https://github.com/andyyaro/provalume/tree/main/docs"

[project.scripts]
provalume = "provalume.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "numpy>=1.26",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provalume"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/evals",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # bugbear
    "UP",          # pyupgrade
    "S",           # flake8-bandit
    "C4",          # comprehensions
    "SIM",         # simplify
    "RET",         # return
    "PTH",         # pathlib
    "RUF",
]
ignore = [
    # Resolving `git` through PATH is deliberate. Hardcoding /usr/bin/git would
    # break on systems where git lives elsewhere (Homebrew, nix, Windows), and
    # every invocation is a fixed argv list with shell=False — asserted by
    # tests/security/test_no_network.py.
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S324", "RUF012"]
# The poisoning patterns must match homoglyph evasion — an attacker writing
# `system prompt：` with a fullwidth colon would otherwise slip past a rule
# written with an ASCII one. The "ambiguous character" is the point.
"src/provalume/policy/poisoning.py" = ["RUF001"]
# Adversarial fixtures deliberately contain homoglyphs and unusual scripts.
"tests/security/test_injection_and_paths.py" = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["provalume"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "model2vec",
    "model2vec.*",
    "fastembed",
    "fastembed.*",
    "sqlite_vec",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: slower tests (concurrency, crash recovery, benchmarks)",
    "vectors: requires the optional vectors extra",
    "signatures: requires the optional signatures extra",
    "network: requires network access (never run in default CI)",
]

[tool.coverage.run]
source = ["provalume"]
branch = true
omit = [
    "src/provalume/demo/*",
    "src/provalume/cli/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
